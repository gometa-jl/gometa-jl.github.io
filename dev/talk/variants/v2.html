<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 · Film strip</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#201d1d;color:#ffe3e1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow:hidden;}
  .stage{position:fixed;inset:0 0 var(--bottom,52px) 0;display:flex;align-items:center;justify-content:center;}
  .stage img.slide{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-drag:none;}
  .zone{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:0;cursor:pointer;padding:0;}
  .zone:focus,.zone:focus-visible{outline:none;}
  .zone-prev{left:0}.zone-next{right:0}
  .bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:12px;
    padding:0 16px;box-sizing:border-box;background:#201d1d;border-top:1px solid rgba(255,227,225,.22);font-size:14px;}
  .bar a,.bar button{color:#ffe3e1;background:transparent;border:1px solid rgba(255,227,225,.4);
    border-radius:10px;padding:6px 12px;font-size:14px;line-height:1;text-decoration:none;cursor:pointer;font-family:inherit;}
  .bar a:hover,.bar button:hover{border-color:#ffe3e1;background:rgba(255,227,225,.08);}
  .bar button:disabled{opacity:.35;cursor:default;}
  .counter{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
  .spacer{flex:1}
  .vlabel{opacity:.75;white-space:nowrap;}
  @media(max-width:640px){.vlabel{display:none}}

  .strip{position:fixed;left:0;right:0;bottom:52px;height:86px;display:flex;gap:8px;align-items:center;
    overflow-x:auto;overflow-y:hidden;padding:6px 10px;box-sizing:border-box;background:#1a1717;
    border-top:1px solid rgba(255,227,225,.18);-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:rgba(255,227,225,.28) #1a1717;}
  .strip::-webkit-scrollbar{height:7px;}
  .strip::-webkit-scrollbar-track{background:#1a1717;}
  .strip::-webkit-scrollbar-thumb{background:rgba(255,227,225,.28);border-radius:4px;}
  .strip::-webkit-scrollbar-thumb:hover{background:rgba(255,227,225,.5);}
  .strip.hidden{display:none;}
  .th{position:relative;flex:0 0 auto;padding:0;border:2px solid rgba(255,227,225,.25);border-radius:6px;
    background:none;cursor:pointer;line-height:0;}
  .th img{width:118px;height:66px;border-radius:4px;display:block;}
  .th span{position:absolute;right:3px;bottom:3px;font-size:10px;line-height:1;color:#ffe3e1;
    background:rgba(32,29,29,.85);border-radius:4px;padding:2px 4px;}
  .th.cur{border-color:#ff41a9;}
  .th:hover{border-color:rgba(255,227,225,.7);}
</style></head>
<body>
  <div class="stage" id="stage">
    <img id="slide" class="slide" alt="Slide 1 of 41">
    <button class="zone zone-prev" id="zoneprev" aria-hidden="true" tabindex="-1"></button>
    <button class="zone zone-next" id="zonenext" aria-hidden="true" tabindex="-1"></button>
  </div>
  <div class="strip" id="strip"><button class="th" data-n="1"><img loading="lazy" src="thumbs/slide-01.webp" alt="Slide 1"><span>1</span></button><button class="th" data-n="2"><img loading="lazy" src="thumbs/slide-02.webp" alt="Slide 2"><span>2</span></button><button class="th" data-n="3"><img loading="lazy" src="thumbs/slide-03.webp" alt="Slide 3"><span>3</span></button><button class="th" data-n="4"><img loading="lazy" src="thumbs/slide-04.webp" alt="Slide 4"><span>4</span></button><button class="th" data-n="5"><img loading="lazy" src="thumbs/slide-05.webp" alt="Slide 5"><span>5</span></button><button class="th" data-n="6"><img loading="lazy" src="thumbs/slide-06.webp" alt="Slide 6"><span>6</span></button><button class="th" data-n="7"><img loading="lazy" src="thumbs/slide-07.webp" alt="Slide 7"><span>7</span></button><button class="th" data-n="8"><img loading="lazy" src="thumbs/slide-08.webp" alt="Slide 8"><span>8</span></button><button class="th" data-n="9"><img loading="lazy" src="thumbs/slide-09.webp" alt="Slide 9"><span>9</span></button><button class="th" data-n="10"><img loading="lazy" src="thumbs/slide-10.webp" alt="Slide 10"><span>10</span></button><button class="th" data-n="11"><img loading="lazy" src="thumbs/slide-11.webp" alt="Slide 11"><span>11</span></button><button class="th" data-n="12"><img loading="lazy" src="thumbs/slide-12.webp" alt="Slide 12"><span>12</span></button><button class="th" data-n="13"><img loading="lazy" src="thumbs/slide-13.webp" alt="Slide 13"><span>13</span></button><button class="th" data-n="14"><img loading="lazy" src="thumbs/slide-14.webp" alt="Slide 14"><span>14</span></button><button class="th" data-n="15"><img loading="lazy" src="thumbs/slide-15.webp" alt="Slide 15"><span>15</span></button><button class="th" data-n="16"><img loading="lazy" src="thumbs/slide-16.webp" alt="Slide 16"><span>16</span></button><button class="th" data-n="17"><img loading="lazy" src="thumbs/slide-17.webp" alt="Slide 17"><span>17</span></button><button class="th" data-n="18"><img loading="lazy" src="thumbs/slide-18.webp" alt="Slide 18"><span>18</span></button><button class="th" data-n="19"><img loading="lazy" src="thumbs/slide-19.webp" alt="Slide 19"><span>19</span></button><button class="th" data-n="20"><img loading="lazy" src="thumbs/slide-20.webp" alt="Slide 20"><span>20</span></button><button class="th" data-n="21"><img loading="lazy" src="thumbs/slide-21.webp" alt="Slide 21"><span>21</span></button><button class="th" data-n="22"><img loading="lazy" src="thumbs/slide-22.webp" alt="Slide 22"><span>22</span></button><button class="th" data-n="23"><img loading="lazy" src="thumbs/slide-23.webp" alt="Slide 23"><span>23</span></button><button class="th" data-n="24"><img loading="lazy" src="thumbs/slide-24.webp" alt="Slide 24"><span>24</span></button><button class="th" data-n="25"><img loading="lazy" src="thumbs/slide-25.webp" alt="Slide 25"><span>25</span></button><button class="th" data-n="26"><img loading="lazy" src="thumbs/slide-26.webp" alt="Slide 26"><span>26</span></button><button class="th" data-n="27"><img loading="lazy" src="thumbs/slide-27.webp" alt="Slide 27"><span>27</span></button><button class="th" data-n="28"><img loading="lazy" src="thumbs/slide-28.webp" alt="Slide 28"><span>28</span></button><button class="th" data-n="29"><img loading="lazy" src="thumbs/slide-29.webp" alt="Slide 29"><span>29</span></button><button class="th" data-n="30"><img loading="lazy" src="thumbs/slide-30.webp" alt="Slide 30"><span>30</span></button><button class="th" data-n="31"><img loading="lazy" src="thumbs/slide-31.webp" alt="Slide 31"><span>31</span></button><button class="th" data-n="32"><img loading="lazy" src="thumbs/slide-32.webp" alt="Slide 32"><span>32</span></button><button class="th" data-n="33"><img loading="lazy" src="thumbs/slide-33.webp" alt="Slide 33"><span>33</span></button><button class="th" data-n="34"><img loading="lazy" src="thumbs/slide-34.webp" alt="Slide 34"><span>34</span></button><button class="th" data-n="35"><img loading="lazy" src="thumbs/slide-35.webp" alt="Slide 35"><span>35</span></button><button class="th" data-n="36"><img loading="lazy" src="thumbs/slide-36.webp" alt="Slide 36"><span>36</span></button><button class="th" data-n="37"><img loading="lazy" src="thumbs/slide-37.webp" alt="Slide 37"><span>37</span></button><button class="th" data-n="38"><img loading="lazy" src="thumbs/slide-38.webp" alt="Slide 38"><span>38</span></button><button class="th" data-n="39"><img loading="lazy" src="thumbs/slide-39.webp" alt="Slide 39"><span>39</span></button><button class="th" data-n="40"><img loading="lazy" src="thumbs/slide-40.webp" alt="Slide 40"><span>40</span></button><button class="th" data-n="41"><img loading="lazy" src="thumbs/slide-41.webp" alt="Slide 41"><span>41</span></button></div>
  <nav class="bar" aria-label="Slide navigation">
    <a href="index.html">&larr; variants</a>
    <span class="spacer"></span>
    <button id="prev" aria-label="Previous slide">&lsaquo;</button>
    <span class="counter" id="counter" aria-live="polite">1 / 41</span>
    <button id="next" aria-label="Next slide">&rsaquo;</button>
    <button id="striptoggle" aria-pressed="true" title="Show/hide the slide band">&#9646;&#9646;&#9646;</button>
    <span class="spacer"></span>
    <span class="vlabel">V2 · swipe the band, tap a slide</span>
  </nav>
<script>(function(){
    var N=41, img=document.getElementById('slide'), counter=document.getElementById('counter');
    var prev=document.getElementById('prev'), next=document.getElementById('next');
    function clamp(n){return Math.min(N,Math.max(1,isNaN(n)?1:n));}
    function pad(n){return (n<10?'0':'')+n;}
    function src(n){return '../slides/slide-'+pad(n)+'.svg';}
    function preload(n){if(n>=1&&n<=N){(new Image()).src=src(n);}}
    var cur=clamp(parseInt((location.hash||'').replace('#',''),10)||1);
    function render(){
      img.src=src(cur);
      img.alt='Slide '+cur+' of '+N;
      counter.textContent=cur+' / '+N;
      prev.disabled=(cur===1); next.disabled=(cur===N);
      history.replaceState(null,'','#'+cur);
      preload(cur+1);preload(cur-1);
      if(window.onSlideChange)window.onSlideChange(cur);
    }
    function go(d){var t=clamp(cur+d);if(t!==cur){cur=t;render();}}
    function jump(n){var t=clamp(n);if(t!==cur){cur=t;render();}}
    prev.addEventListener('click',function(){go(-1);});
    next.addEventListener('click',function(){go(1);});
    var zp=document.getElementById('zoneprev'),zn=document.getElementById('zonenext');
    zp.addEventListener('click',function(){go(-1);});
    zn.addEventListener('click',function(){go(1);});
    zp.addEventListener('mousedown',function(e){e.preventDefault();});
    zn.addEventListener('mousedown',function(e){e.preventDefault();});
    document.addEventListener('keydown',function(e){
      if(e.altKey||e.ctrlKey||e.metaKey)return;
      var t=e.target, tag=t?t.tagName:'';
      if(tag==='INPUT'||tag==='TEXTAREA')return;
      if((tag==='BUTTON'||tag==='A')&&(e.key===' '||e.key==='Enter'))return;
      if(window.onViewerKey&&window.onViewerKey(e))return;
      switch(e.key){
        case 'ArrowRight': case 'PageDown': go(1); e.preventDefault(); break;
        case ' ': go(e.shiftKey?-1:1); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': go(-1); e.preventDefault(); break;
        case 'Home': jump(1); e.preventDefault(); break;
        case 'End': jump(N); e.preventDefault(); break;
      }
    });
    var tx=null;
    document.addEventListener('touchstart',function(e){
      if(e.touches.length===1&&!e.target.closest('.strip,.grid,.bar'))tx=e.touches[0].clientX;
    },{passive:true});
    document.addEventListener('touchend',function(e){
      if(tx===null)return;
      var dx=e.changedTouches[0].clientX-tx; tx=null;
      if(Math.abs(dx)>45)go(dx<0?1:-1);
    },{passive:true});
    window.addEventListener('hashchange',function(){
      var t=clamp(parseInt(location.hash.replace('#',''),10));
      if(t!==cur){cur=t;render();}
    });

    var strip=document.getElementById('strip');
    var stage=document.getElementById('stage');
    var tgl=document.getElementById('striptoggle');
    function layout(){var open=!strip.classList.contains('hidden');
      stage.style.setProperty('--bottom',open?'138px':'52px');
      tgl.setAttribute('aria-pressed',String(open));}
    tgl.addEventListener('click',function(){strip.classList.toggle('hidden');layout();});
    strip.addEventListener('click',function(e){
      var b=e.target.closest('.th');if(b)jump(parseInt(b.dataset.n,10));});
    window.onSlideChange=function(n){
      var all=strip.querySelectorAll('.th');
      all.forEach(function(b){b.classList.toggle('cur',parseInt(b.dataset.n,10)===n);});
      var c=strip.querySelector('.th.cur');
      if(c&&!strip.classList.contains('hidden'))c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    };
    layout();

render();})();</script>
</body></html>
