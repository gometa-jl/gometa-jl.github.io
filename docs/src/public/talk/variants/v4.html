<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V4 · Scrubber</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#201d1d;color:#ffe3e1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow:hidden;}
  .stage{position:fixed;inset:0 0 var(--bottom,52px) 0;display:flex;align-items:center;justify-content:center;}
  .stage img.slide{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-drag:none;}
  .zone{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:0;cursor:pointer;padding:0;}
  .zone:focus,.zone:focus-visible{outline:none;}
  .zone-prev{left:0}.zone-next{right:0}
  .bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:12px;
    padding:0 16px;box-sizing:border-box;background:#201d1d;border-top:1px solid rgba(255,227,225,.22);font-size:14px;}
  .bar a,.bar button{color:#ffe3e1;background:transparent;border:1px solid rgba(255,227,225,.4);
    border-radius:10px;padding:6px 12px;font-size:14px;line-height:1;text-decoration:none;cursor:pointer;font-family:inherit;}
  .bar a:hover,.bar button:hover{border-color:#ffe3e1;background:rgba(255,227,225,.08);}
  .bar button:disabled{opacity:.35;cursor:default;}
  .counter{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
  .spacer{flex:1}
  .vlabel{opacity:.75;white-space:nowrap;}
  @media(max-width:640px){.vlabel{display:none}}

  .scrub{flex:2;display:flex;align-items:center;min-width:120px;}
  .scrub input{width:100%;accent-color:#ff41a9;cursor:pointer;}
  .peek{position:fixed;bottom:60px;transform:translateX(-50%);display:none;z-index:6;
    border:2px solid rgba(255,227,225,.5);border-radius:6px;background:#1a1717;padding:4px;line-height:0;}
  .peek img{width:150px;height:84px;border-radius:4px;display:block;}
  .peek span{position:absolute;right:6px;bottom:6px;font-size:11px;color:#ffe3e1;
    background:rgba(32,29,29,.9);border-radius:4px;padding:2px 5px;line-height:1;}
</style></head>
<body>
  <div class="stage" id="stage">
    <img id="slide" class="slide" alt="Slide 1 of 41">
    <button class="zone zone-prev" id="zoneprev" aria-hidden="true" tabindex="-1"></button>
    <button class="zone zone-next" id="zonenext" aria-hidden="true" tabindex="-1"></button>
  </div>
  <div class="peek" id="peek"><img id="peekimg" alt=""><span id="peekn"></span></div>
  <nav class="bar" aria-label="Slide navigation">
    <a href="index.html">&larr; variants</a>
    <span class="spacer"></span>
    <button id="prev" aria-label="Previous slide">&lsaquo;</button>
    <span class="counter" id="counter" aria-live="polite">1 / 41</span>
    <button id="next" aria-label="Next slide">&rsaquo;</button>
    <span class="scrub"><input id="sc" type="range" min="1" max="41" step="1" value="1" aria-label="Slide scrubber"></span>
    <span class="spacer"></span>
    <span class="vlabel">V4 · drag the slider, release to jump</span>
  </nav>
<script>(function(){
    var N=41, img=document.getElementById('slide'), counter=document.getElementById('counter');
    var prev=document.getElementById('prev'), next=document.getElementById('next');
    function clamp(n){return Math.min(N,Math.max(1,isNaN(n)?1:n));}
    function pad(n){return (n<10?'0':'')+n;}
    function src(n){return '../slides/slide-'+pad(n)+'.svg';}
    function preload(n){if(n>=1&&n<=N){(new Image()).src=src(n);}}
    var cur=clamp(parseInt((location.hash||'').replace('#',''),10)||1);
    function render(){
      img.src=src(cur);
      img.alt='Slide '+cur+' of '+N;
      counter.textContent=cur+' / '+N;
      prev.disabled=(cur===1); next.disabled=(cur===N);
      history.replaceState(null,'','#'+cur);
      preload(cur+1);preload(cur-1);
      if(window.onSlideChange)window.onSlideChange(cur);
    }
    function go(d){var t=clamp(cur+d);if(t!==cur){cur=t;render();}}
    function jump(n){var t=clamp(n);if(t!==cur){cur=t;render();}}
    prev.addEventListener('click',function(){go(-1);});
    next.addEventListener('click',function(){go(1);});
    var zp=document.getElementById('zoneprev'),zn=document.getElementById('zonenext');
    zp.addEventListener('click',function(){go(-1);});
    zn.addEventListener('click',function(){go(1);});
    zp.addEventListener('mousedown',function(e){e.preventDefault();});
    zn.addEventListener('mousedown',function(e){e.preventDefault();});
    document.addEventListener('keydown',function(e){
      if(e.altKey||e.ctrlKey||e.metaKey)return;
      var t=e.target, tag=t?t.tagName:'';
      if(tag==='INPUT'||tag==='TEXTAREA')return;
      if((tag==='BUTTON'||tag==='A')&&(e.key===' '||e.key==='Enter'))return;
      if(window.onViewerKey&&window.onViewerKey(e))return;
      switch(e.key){
        case 'ArrowRight': case 'PageDown': go(1); e.preventDefault(); break;
        case ' ': go(e.shiftKey?-1:1); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': go(-1); e.preventDefault(); break;
        case 'Home': jump(1); e.preventDefault(); break;
        case 'End': jump(N); e.preventDefault(); break;
      }
    });
    var tx=null;
    document.addEventListener('touchstart',function(e){
      if(e.touches.length===1&&!e.target.closest('.strip,.grid,.bar'))tx=e.touches[0].clientX;
    },{passive:true});
    document.addEventListener('touchend',function(e){
      if(tx===null)return;
      var dx=e.changedTouches[0].clientX-tx; tx=null;
      if(Math.abs(dx)>45)go(dx<0?1:-1);
    },{passive:true});
    window.addEventListener('hashchange',function(){
      var t=clamp(parseInt(location.hash.replace('#',''),10));
      if(t!==cur){cur=t;render();}
    });

    var sc=document.getElementById('sc'),peek=document.getElementById('peek');
    var peekimg=document.getElementById('peekimg'),peekn=document.getElementById('peekn');
    function pv(n){
      peekimg.src='thumbs/slide-'+pad(n)+'.webp';peekn.textContent=n;
      var r=sc.getBoundingClientRect();
      var f=(n-1)/(41-1);
      peek.style.left=(r.left+f*r.width)+'px';
      peek.style.display='block';
    }
    sc.addEventListener('input',function(){pv(parseInt(sc.value,10));});
    sc.addEventListener('change',function(){jump(parseInt(sc.value,10));peek.style.display='none';});
    sc.addEventListener('pointerup',function(){setTimeout(function(){peek.style.display='none';},150);});
    sc.addEventListener('mouseleave',function(){if(document.activeElement!==sc)peek.style.display='none';});
    window.onSlideChange=function(n){sc.value=n;};

render();})();</script>
</body></html>
